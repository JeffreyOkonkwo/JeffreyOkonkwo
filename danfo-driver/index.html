<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Danfo Craze</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC91A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:image" content="brand/logo-on-sky.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@600;800&display=swap">
<style>
  :root{ color-scheme: light; --danfo:#FFC91A; --ink:#1b1024; --cream:#fff8e7; --green:#18b86b; --red:#ff4d4d; }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:#5ec8ff;overflow:hidden}
  body{font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cream);
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  button{font:inherit;cursor:pointer;color:inherit}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .ol{text-shadow:0 4px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}

  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none}
  .score{font-family:"Bungee",Impact,sans-serif;font-size:clamp(30px,8vw,44px);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
  .best{font-weight:800;font-size:14px;color:var(--danfo);margin-top:2px}
  .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .chip{font-family:"Bungee",Impact,sans-serif;font-size:13px;padding:2px 10px;border-radius:999px;border:3px solid var(--ink);
    background:var(--danfo);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .chip.party{background:var(--green);color:#fff}.chip.mag{background:#ff5a5a;color:#fff}.chip.cop{background:#2f5bff;color:#fff;animation:flash .5s steps(2) infinite}
  @keyframes flash{50%{background:#ff2a1f}}
  .right{display:flex;align-items:center;gap:10px}
  .coins{display:flex;align-items:center;gap:6px;font-family:"Bungee",Impact,sans-serif;font-size:clamp(20px,5.4vw,26px);color:#fff;
    background:rgba(27,16,36,.55);border:3px solid var(--ink);border-radius:999px;padding:2px 14px 2px 4px;font-variant-numeric:tabular-nums}
  .coin-i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6,#ffc91a 55%,#d99100);
    border:3px solid var(--ink);display:grid;place-items:center;font-size:14px;color:#8a5a00;font-family:"Baloo 2",sans-serif;font-weight:800;line-height:1}
  .pax-i{position:relative;width:22px;height:26px}.pax-i::before{content:"";position:absolute;left:5px;top:0;width:12px;height:12px;border-radius:50%;background:#a0673f;border:3px solid var(--ink)}.pax-i::after{content:"";position:absolute;left:1px;bottom:0;width:20px;height:11px;border-radius:10px 10px 4px 4px;background:var(--green);border:3px solid var(--ink)}
  .coins.pax{padding-left:8px}
  .pause{pointer-events:auto;width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);
    font-family:"Bungee",Impact,sans-serif;font-size:17px;box-shadow:0 4px 0 var(--ink)}
  .pause:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .rcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .clock{display:flex;align-items:center;gap:6px;font:800 12px/1 "Baloo 2",sans-serif;color:#fff;background:rgba(27,16,36,.5);border-radius:999px;padding:3px 9px 3px 3px;opacity:.9}
  .clock .dial{position:relative;width:20px;height:20px;border-radius:50%;background:#ffe066;border:2px solid var(--ink);transition:background .6s}
  .clock .dial.night{background:#3a4486}.clock .dial.dusk{background:#ff9a4d}
  .clock .dial i{position:absolute;left:50%;top:50%;width:2px;height:7px;margin-left:-1px;background:var(--ink);transform-origin:50% 0;border-radius:2px}
  .clock .fc{display:flex;align-items:center;gap:4px;padding-left:6px;border-left:1px solid rgba(255,255,255,.35)}
  .clock .fc[hidden]{display:none}
  .clock .fc svg{width:16px;height:16px}
  .clock.warn .fc{animation:fcPulse 1.2s ease-in-out infinite}
  @keyframes fcPulse{50%{opacity:.45}}
  #wx{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);width:min(92vw,420px);
    background:rgba(27,16,36,.92);border:3px solid #ffe066;border-radius:18px;padding:10px 12px 12px;color:#fff;text-align:center;z-index:6}
  #wx[hidden]{display:none}
  .shareg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .shareg .more{grid-column:1/-1;border:3px solid var(--ink);border-radius:12px;padding:10px;font:800 15px/1.1 "Baloo 2",sans-serif;background:var(--danfo);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .shb{display:grid;place-items:center;border:3px solid var(--ink);border-radius:12px;padding:10px 4px;font:800 14px/1 "Baloo 2",sans-serif;color:#fff;text-decoration:none;box-shadow:0 3px 0 var(--ink)}
  .shcopy{grid-column:1/-1;display:flex;gap:6px}.shcopy input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:12px;padding:8px;font:700 13px "Baloo 2",sans-serif}
  .shcopy button{border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font:800 14px "Baloo 2",sans-serif;background:#fff;color:var(--ink)}
  #wx .wt{font-family:"Bungee",Impact,sans-serif;font-size:16px;color:#ffe066;margin-bottom:8px}
  #wx .wb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #wx button{flex:1 1 0;min-width:0;border:3px solid var(--ink);border-radius:12px;padding:8px 6px;font:800 14px/1.1 "Baloo 2",sans-serif;box-shadow:0 3px 0 var(--ink);background:#fff;color:var(--ink)}
  #wx button.day{background:#ffe066}#wx button.dry{background:#7fd0ff}#wx button.keep{background:#3fe08f}
  #wx .bar{height:4px;border-radius:4px;background:#ffe066;margin-top:10px;transform-origin:left}

  #toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 160px);pointer-events:none}
  .toast{position:absolute;left:50%;transform:translateX(-50%);font-family:"Bungee",Impact,sans-serif;font-size:clamp(17px,4.6vw,26px);line-height:1.1;
    color:#FFC91A;background:rgba(27,16,36,.9);border:3px solid #FFC91A;border-radius:14px;padding:6px 16px 7px;box-shadow:0 5px 0 rgba(27,16,36,.5);
    white-space:nowrap;animation:toast 1.8s ease-out forwards}
  .toast.tsub{font-size:clamp(13px,3.6vw,17px);top:52px;color:#fff;border-color:rgba(255,255,255,.35)}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}14%{opacity:1;transform:translate(-50%,0) scale(1.06)}24%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-16px)}}

  #pops{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 124px);pointer-events:none}
  .pop{position:absolute;left:0;top:0;font-family:"Bungee",Impact,sans-serif;font-size:clamp(15px,4.2vw,20px);line-height:1;color:#FFC91A;
    white-space:nowrap;background:rgba(27,16,36,.85);padding:5px 12px 6px;border-radius:12px;border:3px solid #FFC91A;
    animation:popIn .95s ease-out forwards}
  .pop small{margin-left:6px;font-size:.8em;color:#fff}
  .pop.green{color:#4ff0a0;border-color:#4ff0a0}
  @keyframes popIn{0%{opacity:0;transform:translateX(-16px) scale(.8)}15%{opacity:1;transform:translateX(0) scale(1.06)}25%{transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s;animation-delay:1s}}
  .hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:8px;pointer-events:none}
  .hint .arrows{font-family:"Bungee",Impact,sans-serif;font-size:clamp(60px,16vw,110px);line-height:1;color:#fff;animation:nudge .7s ease-in-out infinite alternate}
  .hint.up .arrows{animation-name:nudgeUp}
  .hint.good .txt{background:var(--green)}
  .hint.bad .txt{background:var(--red)}
  .hint .txt{font-family:"Bungee",Impact,sans-serif;font-size:clamp(20px,5.4vw,30px);color:#fff;background:var(--ink);padding:5px 18px;border-radius:14px}
  @keyframes nudge{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
  @keyframes nudgeUp{from{transform:translateY(14px)}to{transform:translateY(-14px)}}

  .overlay{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .title{align-content:space-between;justify-items:center;text-align:center;gap:16px;
    background:linear-gradient(180deg,rgba(27,16,36,.25),rgba(27,16,36,0) 30%,rgba(27,16,36,0) 55%,rgba(27,16,36,.55));-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
  .logo{display:grid;justify-items:center;gap:6px;margin-top:3vh;animation:bob 2.4s ease-in-out infinite}
  .logo h1{margin:0;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:clamp(44px,min(14vw,12vh),108px);line-height:.84;color:var(--danfo);
    -webkit-text-stroke:3px var(--ink);text-shadow:0 8px 0 var(--ink),0 16px 26px rgba(0,0,0,.3)}
  .logo h1 span{display:block;color:#fff}
  .logoimg{display:block;width:min(560px,92vw);max-height:34vh;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
  .stripes{width:min(380px,74vw);height:22px;border:4px solid var(--ink);border-radius:8px;
    background:linear-gradient(var(--danfo) 0 20%,var(--ink) 20% 42%,var(--danfo) 42% 58%,var(--ink) 58% 80%,var(--danfo) 80%)}
  .tagline{font-family:"Bungee",Impact,sans-serif;font-size:clamp(14px,3.8vw,18px);color:#fff}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .bottom{display:grid;gap:10px;justify-items:center;margin-bottom:1vh;width:min(440px,100%);background:rgba(27,16,36,.88);
    border:3px solid rgba(255,255,255,.14);border-radius:24px;padding:12px 12px 12px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .play{border:4px solid var(--ink);border-radius:24px;padding:14px 46px;font-family:"Bungee",Impact,sans-serif;font-size:clamp(26px,7vw,36px);
    background:linear-gradient(#4ff0a0,var(--green));color:#fff;box-shadow:inset 0 6px 0 rgba(255,255,255,.35),0 8px 0 var(--ink);animation:pulse .8s ease-in-out infinite alternate}
  .play:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
  @keyframes pulse{to{transform:scale(1.06)}}
  .diffs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .dsel{pointer-events:auto;border:3px solid var(--ink);border-radius:16px;padding:6px 12px 5px;background:rgba(27,16,36,.72);color:#fff;
    box-shadow:0 4px 0 var(--ink);display:grid;justify-items:center;line-height:1.05;min-width:92px}
  .dsel b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:16px}
  .dsel small{font-weight:800;font-size:11px;opacity:.85;letter-spacing:.06em}
  .dsel[aria-checked="true"]{background:var(--danfo);color:var(--ink)}
  .dsel:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .chip.lvl{background:#fff}
  .meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-weight:800}
  .title .play{padding:10px 44px;font-size:clamp(24px,6.4vw,32px)}
  .sound{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;padding:4px 10px;font-size:13px}
  .pillm{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 12px;font-size:13px;font-variant-numeric:tabular-nums}
  .small{pointer-events:auto;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:5px 14px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
  .howto{font-weight:700;font-size:13px;line-height:1.35;color:#fff;opacity:.9;max-width:34ch}
  .coin-i.sm{display:inline-grid;width:18px;height:18px;font-size:10px;border-width:2px;vertical-align:-3px;margin-right:5px}
  .card{width:min(360px,100%);background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
    padding:18px 18px 20px;display:grid;gap:10px;justify-items:center;text-align:center}
  .card h2{margin:0;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:clamp(38px,11vw,54px);color:var(--red);-webkit-text-stroke:2px var(--ink);line-height:1}
  .why{font-weight:700;font-size:16px;margin:0;line-height:1.3}
  .big{font-family:"Bungee",Impact,sans-serif;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
  .lbl{font-size:11px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;opacity:.6}
  .row{display:flex;gap:22px;justify-content:center;font-variant-numeric:tabular-nums}
  .row b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:20px}
  .newbest{font-family:"Bungee",Impact,sans-serif;background:var(--danfo);border:3px solid var(--ink);border-radius:10px;padding:2px 14px;transform:rotate(-3deg)}
  .card .play{animation:none;padding:12px 30px}
  .tag1{font-family:"Bungee",Impact,sans-serif;font-size:clamp(15px,4.2vw,22px);color:#fff;background:var(--ink);padding:3px 14px;border-radius:10px;transform:rotate(-3deg);margin-top:-6px}
  .tag2{font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}
  .daily{font-weight:800;font-size:13px;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 12px;animation:fadeaway 5s ease-in forwards}
  @keyframes fadeaway{0%,75%{opacity:1}100%{opacity:0;visibility:hidden}}
  .menu4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
  .topbar{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0}
  .topbar .sp{flex:1}
  .tb{background:rgba(27,16,36,.78);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;min-height:36px;display:flex;align-items:center;gap:6px}
  .tb svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .tb.name{max-width:52vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .xbtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:18px;font-weight:800;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);z-index:2}
  .xbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .card{position:relative}
  .mbtn{position:relative;display:grid;justify-items:center;gap:4px;padding:2px 0;background:none;border:0;font-weight:800;font-size:11.5px;color:#fff}
  .mbtn .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;border:3px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 var(--ink)}
  .mbtn svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .mbtn:active .ic{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .m1 .ic{background:#18b86b}.m2 .ic{background:#2f7bff}.m3 .ic{background:#ff7b25}.m4 .ic{background:#8b5cf6}
  .mbtn .dot{position:absolute;top:-2px;right:calc(50% - 32px);width:10px;height:10px;border-radius:50%;background:#ff4d4d;border:2px solid var(--ink)}
  .lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;padding:4px 10px;font-size:13px}
  .chal{width:100%;border:4px solid var(--ink);border-radius:16px;padding:9px 12px;background:#25d366;color:#fff;font-family:"Bungee",Impact,sans-serif;font-size:16px;box-shadow:0 5px 0 var(--ink)}
  .chal:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .chip.beat{background:#25d366;color:#fff}
  .sheetc{max-width:460px;max-height:86vh;grid-template-rows:auto 1fr auto}
  .sh{padding:0 44px;color:var(--ink)!important;-webkit-text-stroke:0!important;font-size:clamp(26px,7vw,34px)!important}
  .sbody{overflow:auto;width:100%;display:grid;gap:8px;text-align:left}
  .mis{display:grid;gap:4px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff8e1}
  .mis.done{background:#d9fbe8}
  .mis .top{display:flex;justify-content:space-between;gap:8px;font-weight:800}
  .mis .rw{font-family:"Bungee",Impact,sans-serif;font-weight:400;color:#b07a00;white-space:nowrap}
  .pbar{height:10px;border-radius:6px;background:#e9e3f0;overflow:hidden;border:2px solid var(--ink)}.pbar i{display:block;height:100%;background:var(--green)}
  .skins{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .skin{display:grid;justify-items:center;gap:2px;border:3px solid var(--ink);border-radius:14px;padding:6px;background:#eef6ff;color:var(--ink);font-weight:800;font-size:13px}
  .skin canvas{width:100%;height:auto;max-width:150px}
  .skin.on{background:#fff3b0;box-shadow:0 0 0 3px var(--danfo) inset}
  .skin small{font-weight:800;font-size:12px;opacity:.8}
  .stop{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-weight:800}
  .stop .pin{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:#d0cbd8;display:grid;place-items:center;font-size:13px}
  .stop.on .pin{background:var(--green);color:#fff}
  .stop small{display:block;font-weight:700;opacity:.7}
  .nickin{font:inherit;font-size:18px;font-weight:800;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
  .nick{display:flex;align-items:center;gap:8px;width:100%;max-width:340px;font-weight:800;font-size:13px;color:#fff}
  .nick span{white-space:nowrap;opacity:.8}
  .nick input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:800;color:var(--ink);background:#fff;border:3px solid var(--danfo);border-radius:12px;padding:6px 10px}
  .nick input:focus{outline:3px solid #fff;outline-offset:1px}
  .quizbtn{width:100%;border:4px solid var(--ink);border-radius:18px;padding:10px 14px;background:linear-gradient(#ffe066,var(--danfo));color:var(--ink);
    box-shadow:0 6px 0 var(--ink);display:grid;gap:2px}
  .quizbtn b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:20px}
  .quizbtn small{font-weight:800;font-size:12px}
  .quizbtn:disabled{opacity:.5;cursor:default}
  .quizbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  .qcard{max-width:440px;text-align:left;justify-items:stretch}
  .qtag{justify-self:start;font-family:"Bungee",Impact,sans-serif;font-size:13px;background:var(--green);color:#fff;padding:3px 10px;border-radius:8px;border:3px solid var(--ink)}
  .qbar{height:10px;border-radius:6px;background:#e9e3f0;overflow:hidden;border:2px solid var(--ink)}
  .qbar i{display:block;height:100%;width:100%;background:var(--danfo)}
  .qq{margin:0;font-weight:800;font-size:clamp(18px,4.8vw,22px);line-height:1.3}
  .qopts{display:grid;gap:8px}
  .qopt{text-align:left;font-weight:800;font-size:17px;padding:10px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
  .qopt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .qopt.right{background:#4ff0a0}.qopt.wrong{background:#ff8b80}
  .qfact{margin:0;font-weight:700;font-size:15px;line-height:1.4;background:#fff6d6;border:2px solid var(--danfo);border-radius:12px;padding:8px 12px}
  @media (prefers-reduced-motion:reduce){.logo,.play,.hint .arrows,.chip.cop{animation:none}}
</style>
</head>
<body>
<div id="stage">

// ---------------------------------------------------------------- drawing helpers (cartoon: bold fill + thick ink outline)
const shadeCache = new Map();
function shade(hex, f) {
