<style>
  /* fonts are bundled with the game so it looks right offline and inside the store apps */

  @font-face{font-family:"Baloo 2";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/baloo-2-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"Baloo 2";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Baloo 2";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  :root{ color-scheme: light; --danfo:#FFC91A; --ink:#1b1024; --cream:#fff8e7; --green:#18b86b; --red:#ff4d4d; }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:#5ec8ff;overflow:hidden}
  body{font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cream);
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  button{font:inherit;cursor:pointer;color:inherit}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .ol{text-shadow:0 4px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}

  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none}
  .score{font-family:"Bungee",Impact,sans-serif;font-size:clamp(30px,8vw,44px);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
  .best{font-weight:800;font-size:14px;color:var(--danfo);margin-top:2px}
  .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .chip{font-family:"Bungee",Impact,sans-serif;font-size:13px;padding:2px 10px;border-radius:999px;border:3px solid var(--ink);
    background:var(--danfo);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .chip.party{background:var(--green);color:#fff}.chip.mag{background:#ff5a5a;color:#fff}.chip.cop{background:#2f5bff;color:#fff;animation:flash .5s steps(2) infinite}
  @keyframes flash{50%{background:#ff2a1f}}
  .right{display:flex;align-items:center;gap:10px}
  .heat{display:flex;gap:5px;margin-top:7px;padding:4px 7px;background:rgba(27,16,36,.55);border-radius:999px;width:max-content}
  .heat i{width:18px;height:14px;border-radius:9px 9px 3px 3px;background:#6d6882;border:2px solid var(--ink);transition:background .2s}
  .heat i.on{background:#ff2a1f;box-shadow:0 0 9px #ff2a1f}.heat i.on:nth-child(2){background:#2f5bff;box-shadow:0 0 9px #2f5bff}
  .heat.chase i.on{animation:sirenF .45s steps(2) infinite}
  @keyframes sirenF{50%{filter:brightness(1.9)}}
  .coins{display:flex;align-items:center;gap:6px;font-family:"Bungee",Impact,sans-serif;font-size:clamp(20px,5.4vw,26px);color:#fff;
    background:rgba(27,16,36,.55);border:3px solid var(--ink);border-radius:999px;padding:2px 14px 2px 4px;font-variant-numeric:tabular-nums}
  .coin-i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6,#ffc91a 55%,#d99100);
    border:3px solid var(--ink);display:grid;place-items:center;font-size:14px;color:#8a5a00;font-family:"Baloo 2",sans-serif;font-weight:800;line-height:1}
  .pax-i{position:relative;width:22px;height:26px}.pax-i::before{content:"";position:absolute;left:5px;top:0;width:12px;height:12px;border-radius:50%;background:#a0673f;border:3px solid var(--ink)}.pax-i::after{content:"";position:absolute;left:1px;bottom:0;width:20px;height:11px;border-radius:10px 10px 4px 4px;background:var(--green);border:3px solid var(--ink)}
  .coins.pax{padding-left:8px}
  .pause{pointer-events:auto;width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);
    font-family:"Bungee",Impact,sans-serif;font-size:17px;box-shadow:0 4px 0 var(--ink)}
  .pause:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .rcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .clock{display:flex;align-items:center;gap:6px;font:800 12px/1 "Baloo 2",sans-serif;color:#fff;background:rgba(27,16,36,.5);border-radius:999px;padding:3px 9px 3px 3px;opacity:.9}
  .clock .dial{position:relative;width:20px;height:20px;border-radius:50%;background:#ffe066;border:2px solid var(--ink);transition:background .6s}
  .clock .dial.night{background:#3a4486}.clock .dial.dusk{background:#ff9a4d}
  .clock .dial i{position:absolute;left:50%;top:50%;width:2px;height:7px;margin-left:-1px;background:var(--ink);transform-origin:50% 0;border-radius:2px}
  .clock[hidden]{display:none}
  .clock .fc{display:flex;align-items:center;gap:5px;padding:2px 4px}
  .clock .fc[hidden]{display:none}
  .clock .fc svg{width:16px;height:16px}
  .clock.warn .fc{animation:fcPulse 1.2s ease-in-out infinite}
  @keyframes fcPulse{50%{opacity:.45}}
  #ptimer{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(86vw,340px);text-align:center;pointer-events:none;
    font-family:"Bungee",Impact,sans-serif;font-size:13px;color:#fff;background:rgba(27,16,36,.7);border:3px solid #3fe08f;border-radius:14px;padding:4px 10px 7px}
  #ptimer[hidden]{display:none}
  #ptimer .pt1{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px}
  #ptimer .pti{width:28px;height:28px;border-radius:50%;background:#8b5cf6;display:grid;place-items:center;border:2px solid #fff;font-size:15px}
  #ptimer .pts{font-size:26px;line-height:1;color:#ffe066;min-width:36px;text-align:right}
  #pcount{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:"Bungee",Impact,sans-serif;font-size:clamp(70px,22vw,120px);color:#fff;pointer-events:none;
    text-shadow:0 6px 0 #1b1024,3px 0 0 #1b1024,-3px 0 0 #1b1024,0 -3px 0 #1b1024,3px 3px 0 #1b1024,-3px 3px 0 #1b1024,3px -3px 0 #1b1024,-3px -3px 0 #1b1024}
  #pcount[hidden]{display:none}
  #pcount.go{animation:pcPop .9s ease-out}
  @keyframes pcPop{0%{transform:translate(-50%,-50%) scale(1.6);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{opacity:.7}}
  #ptimer small{display:block;margin-top:4px;font:800 12px/1.2 "Baloo 2",sans-serif;color:#d9ffe9}
  #ptimer i{display:block;height:12px;border-radius:6px;background:rgba(255,255,255,.2);margin-top:4px;overflow:hidden}
  #ptimer b{display:block;height:100%;background:linear-gradient(90deg,#3fe08f,#ffe066);transform-origin:left;border-radius:6px}
  #ptimer.end{border-color:#ff4d4d;animation:fcPulse .4s ease-in-out infinite}
  .sponsorline{font:800 13px 'Baloo 2',sans-serif;color:#fff;background:rgba(27,16,36,.6);border:2px solid #FFC91A;border-radius:999px;padding:2px 12px;margin-top:4px}
  .shbox{display:grid;gap:12px}
  .honk{pointer-events:auto;border:3px solid var(--ink);border-radius:14px;padding:5px 14px 6px;background:#ff5a3c;color:#fff;display:grid;justify-items:center;line-height:1.05;box-shadow:0 3px 0 var(--ink);margin-top:-4px}
  .honk b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:15px}.honk small{font-weight:800;font-size:11px;opacity:.9}.honk.ready{background:var(--green)}
  .contbox{display:grid;gap:4px;width:100%}
  .adcont{width:100%;border:4px solid var(--ink);border-radius:18px;padding:10px 14px;background:linear-gradient(#b79bff,#8b5cf6);color:#fff;box-shadow:0 6px 0 var(--ink);display:grid;gap:2px}
  .adcont b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:20px}.adcont small{font-weight:800;font-size:12px}
  .adcont.alt{background:none;border:0;box-shadow:none;padding:4px;color:var(--ink)}.adcont.alt b{font:800 14px/1.2 "Baloo 2",sans-serif;text-decoration:underline}.adcont.alt small{display:none}
  .minor{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap}
  .linkbtn{background:none;border:0;padding:4px 2px;font:800 14px/1.2 "Baloo 2",sans-serif;color:var(--ink);text-decoration:underline;opacity:.8}
  #over .chal{font-size:14px;padding:7px 12px;box-shadow:0 3px 0 var(--ink)}
  .contnote{font-weight:800;font-size:13px;opacity:.8;margin-top:2px}.contnote.clean{color:var(--green);opacity:1}
  html.has-banner .title{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
  .shopl{display:grid;gap:8px}.prod{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff8e7}
  .prod b{font-weight:800;font-size:16px}.prod small{grid-column:1;font-weight:700;opacity:.75;font-size:13px}.prod button{grid-row:1/3;grid-column:2;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--green);color:#fff;font:800 15px "Baloo 2",sans-serif;box-shadow:0 3px 0 var(--ink);min-width:78px}
  .prod button:disabled{background:#d0cbd8;color:var(--ink);box-shadow:none}.prod.own{opacity:.75}
  .shopnote{margin:0;font-size:13px;font-weight:700;opacity:.75}.restore{justify-self:center;border:0;background:none;font:800 14px "Baloo 2",sans-serif;text-decoration:underline;color:var(--ink)}
  .shscore{display:grid;justify-items:center;background:var(--danfo);border:3px solid var(--ink);border-radius:18px;padding:8px 10px 10px;box-shadow:0 4px 0 var(--ink)}
  .shscore small{font-weight:800;font-size:13px;opacity:.75}.shscore b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:40px;line-height:1.05}.shscore span{font-weight:800;font-size:13px}
  .shmain{display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:10px;background:#fff;color:var(--ink);font:800 16px/1 "Baloo 2",sans-serif;box-shadow:0 3px 0 var(--ink)}
  .shmain svg{width:22px;height:22px}
  .shapps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  @media (max-width:359px){.shapps{grid-template-columns:repeat(3,1fr);row-gap:10px}}
  .shapp{display:grid;justify-items:center;gap:4px;text-decoration:none;color:var(--ink);font:800 11px/1 "Baloo 2",sans-serif}
  .shapp i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}.shapp i svg{width:24px;height:24px}
  .shapp:active i{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .shcopy{display:flex;gap:6px}.shcopy input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font:700 13px "Baloo 2",sans-serif;color:#5a5068;background:#f6f2ea}
  .shcopy button{border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font:800 14px "Baloo 2",sans-serif;background:var(--ink);color:#fff;min-width:64px}.shcopy button.ok{background:var(--green)}

  .citypop{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translate(-50%,-14px) scale(.96);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;z-index:6;
    display:grid;justify-items:center;gap:0;max-width:min(300px,84vw);padding:4px 14px 6px;border-radius:14px;border:3px solid var(--ink);background:rgba(24,184,107,.9);color:#fff;text-align:center;box-shadow:0 3px 0 var(--ink)}
  .citypop.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .citypop small{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#e4ffef}
  .citypop b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:17px;line-height:1.1}
  .citypop span{font-weight:800;font-size:12.5px;color:#FFC91A;line-height:1.2}
  #toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 160px);pointer-events:none}
  .toast{position:absolute;left:50%;transform:translateX(-50%);font-family:"Bungee",Impact,sans-serif;font-size:clamp(17px,4.6vw,26px);line-height:1.1;
    color:#FFC91A;background:rgba(27,16,36,.9);border:3px solid #FFC91A;border-radius:14px;padding:6px 16px 7px;box-shadow:0 5px 0 rgba(27,16,36,.5);
    white-space:nowrap;animation:toast 1.8s ease-out forwards}
  .toast.big{font-size:clamp(22px,6.4vw,34px);color:#fff;background:#18b86b;border-color:#1b1024;white-space:normal;width:max-content;max-width:92vw;text-align:center;animation-duration:2.6s}
  .toast.tsub{font-size:clamp(13px,3.6vw,17px);top:52px;color:#fff;border-color:rgba(255,255,255,.35)}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}14%{opacity:1;transform:translate(-50%,0) scale(1.06)}24%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-16px)}}

  #pops{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 124px);pointer-events:none}
  .pop{position:absolute;left:0;top:0;font-family:"Bungee",Impact,sans-serif;font-size:clamp(15px,4.2vw,20px);line-height:1;color:#FFC91A;
    white-space:nowrap;background:rgba(27,16,36,.85);padding:5px 12px 6px;border-radius:12px;border:3px solid #FFC91A;
    animation:popIn .95s ease-out forwards}
  .pop small{margin-left:6px;font-size:.8em;color:#fff}
  .pop.green{color:#4ff0a0;border-color:#4ff0a0}
  @keyframes popIn{0%{opacity:0;transform:translateX(-16px) scale(.8)}15%{opacity:1;transform:translateX(0) scale(1.06)}25%{transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s;animation-delay:1s}}
  .hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:8px;pointer-events:none}
  .hint .arrows{font-family:"Bungee",Impact,sans-serif;font-size:clamp(60px,16vw,110px);line-height:1;color:#fff;animation:nudge .7s ease-in-out infinite alternate}
  .hint.up .arrows{animation-name:nudgeUp}
  .hint.good .txt{background:var(--green)}
  .hint.bad .txt{background:var(--red)}
  .hint .txt{font-family:"Bungee",Impact,sans-serif;font-size:clamp(20px,5.4vw,30px);color:#fff;background:var(--ink);padding:5px 18px;border-radius:14px}
  @keyframes nudge{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
  @keyframes nudgeUp{from{transform:translateY(14px)}to{transform:translateY(-14px)}}

  .overlay{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .title{align-content:space-between;justify-items:center;text-align:center;gap:16px;
    background:linear-gradient(180deg,rgba(27,16,36,.25),rgba(27,16,36,0) 30%,rgba(27,16,36,0) 55%,rgba(27,16,36,.55));-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
  .logo{display:grid;justify-items:center;gap:6px;margin-top:3vh;animation:bob 2.4s ease-in-out infinite}
  .logo h1{margin:0;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:clamp(44px,min(14vw,12vh),108px);line-height:.84;color:var(--danfo);
    -webkit-text-stroke:3px var(--ink);text-shadow:0 8px 0 var(--ink),0 16px 26px rgba(0,0,0,.3)}
  .logo h1 span{display:block;color:#fff}
  .logoimg{display:block;width:min(560px,92vw);max-height:34vh;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
  .stripes{width:min(380px,74vw);height:22px;border:4px solid var(--ink);border-radius:8px;
    background:linear-gradient(var(--danfo) 0 20%,var(--ink) 20% 42%,var(--danfo) 42% 58%,var(--ink) 58% 80%,var(--danfo) 80%)}
  .tagline{font-family:"Bungee",Impact,sans-serif;font-size:clamp(14px,3.8vw,18px);color:#fff}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .bottom{display:grid;gap:10px;justify-items:center;margin-bottom:1vh;width:min(440px,100%);background:rgba(27,16,36,.88);
    border:3px solid rgba(255,255,255,.14);border-radius:24px;padding:12px 12px 12px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .play{border:4px solid var(--ink);border-radius:24px;padding:14px 46px;font-family:"Bungee",Impact,sans-serif;font-size:clamp(26px,7vw,36px);
    background:linear-gradient(#4ff0a0,var(--green));color:#fff;box-shadow:inset 0 6px 0 rgba(255,255,255,.35),0 8px 0 var(--ink);animation:pulse .8s ease-in-out infinite alternate}
  .play:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
  @keyframes pulse{to{transform:scale(1.06)}}
  .diffs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .dsel{pointer-events:auto;border:3px solid var(--ink);border-radius:16px;padding:6px 12px 5px;background:rgba(27,16,36,.72);color:#fff;
    box-shadow:0 4px 0 var(--ink);display:grid;justify-items:center;line-height:1.05;min-width:92px}
  .dsel b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:16px}
  .dsel small{font-weight:800;font-size:11px;opacity:.85;letter-spacing:.06em}
  .dsel[aria-checked="true"]{background:var(--danfo);color:var(--ink)}
  @media (max-width:370px){.diffs{gap:5px;flex-wrap:nowrap}.dsel{padding:5px 6px 4px;border-radius:14px;min-width:0}.dsel b{font-size:13px}.dsel small{font-size:10px}.logoimg{max-height:28vh;margin-top:22px}}
  @media (max-height:600px){.logoimg{max-height:26vh}}

function lbSubmit(score, force) {

function drawBoard() {

function loadBoard() {

      lbFreshUntil = Date.now() + 120000; if (lbData && lbData !== 'off') for (const k of ['world', 'clean', 'country']) lbData[k] = (lbData[k] || []).filter(e => e.h !== lbGone);

    }).catch(() => { toast(t('lbOffTry'), true, '', true); showBoard(); });
  }, showBoard);
  if ($('lbIn')) $('lbIn').onclick = () => { store.set('lbOk', true); toast(t('lbNext')); showBoard(); };

// cheap-phone mode: if frames are slow for a few seconds, draw at lower resolution
