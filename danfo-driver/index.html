<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Danfo Craze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@600;800&display=swap">
<style>
  :root{ color-scheme: light; --danfo:#FFC91A; --ink:#1b1024; --cream:#fff8e7; --green:#18b86b; --red:#ff4d4d; }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:#5ec8ff;overflow:hidden}
  body{font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cream);
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  button{font:inherit;cursor:pointer;color:inherit}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .ol{text-shadow:0 4px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}

  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none}
  .score{font-family:"Bungee",Impact,sans-serif;font-size:clamp(30px,8vw,44px);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
  .best{font-weight:800;font-size:14px;color:var(--danfo);margin-top:2px}
  .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .chip{font-family:"Bungee",Impact,sans-serif;font-size:13px;padding:2px 10px;border-radius:999px;border:3px solid var(--ink);
    background:var(--danfo);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .chip.party{background:var(--green);color:#fff}.chip.mag{background:#ff5a5a;color:#fff}.chip.cop{background:#2f5bff;color:#fff;animation:flash .5s steps(2) infinite}
  @keyframes flash{50%{background:#ff2a1f}}
  .right{display:flex;align-items:center;gap:10px}
  .coins{display:flex;align-items:center;gap:6px;font-family:"Bungee",Impact,sans-serif;font-size:clamp(20px,5.4vw,26px);color:#fff;
    background:rgba(27,16,36,.55);border:3px solid var(--ink);border-radius:999px;padding:2px 14px 2px 4px;font-variant-numeric:tabular-nums}
  .coin-i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6,#ffc91a 55%,#d99100);
    border:3px solid var(--ink);display:grid;place-items:center;font-size:14px;color:#8a5a00;font-family:"Baloo 2",sans-serif;font-weight:800;line-height:1}
  .pax-i{position:relative;width:22px;height:26px}.pax-i::before{content:"";position:absolute;left:5px;top:0;width:12px;height:12px;border-radius:50%;background:#a0673f;border:3px solid var(--ink)}.pax-i::after{content:"";position:absolute;left:1px;bottom:0;width:20px;height:11px;border-radius:10px 10px 4px 4px;background:var(--green);border:3px solid var(--ink)}
  .coins.pax{padding-left:8px}
  .pause{pointer-events:auto;width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);
    font-family:"Bungee",Impact,sans-serif;font-size:17px;box-shadow:0 4px 0 var(--ink)}
  .pause:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

  #toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 160px);pointer-events:none}
  .toast{position:absolute;left:50%;transform:translateX(-50%);font-family:"Bungee",Impact,sans-serif;font-size:clamp(18px,5vw,30px);
    color:#fff;white-space:nowrap;animation:toast 1.5s ease-out forwards}
  .toast.small{font-size:clamp(14px,3.8vw,20px);top:40px}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}14%{opacity:1;transform:translate(-50%,0) scale(1.12)}24%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}

  #pops{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 124px);pointer-events:none}
  .pop{position:absolute;left:0;top:0;font-family:"Bungee",Impact,sans-serif;font-size:clamp(15px,4.2vw,20px);line-height:1;color:#FFC91A;
    white-space:nowrap;background:rgba(27,16,36,.85);padding:5px 12px 6px;border-radius:12px;border:3px solid #FFC91A;
    animation:popIn .95s ease-out forwards}
  .pop small{margin-left:6px;font-size:.8em;color:#fff}
  .pop.green{color:#4ff0a0;border-color:#4ff0a0}
  @keyframes popIn{0%{opacity:0;transform:translateX(-16px) scale(.8)}15%{opacity:1;transform:translateX(0) scale(1.06)}25%{transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s;animation-delay:1s}}
  .hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:8px;pointer-events:none}
  .hint .arrows{font-family:"Bungee",Impact,sans-serif;font-size:clamp(60px,16vw,110px);line-height:1;color:#fff;animation:nudge .7s ease-in-out infinite alternate}
  .hint.up .arrows{animation-name:nudgeUp}
  .hint.good .txt{background:var(--green)}
  .hint.bad .txt{background:var(--red)}
  .hint .txt{font-family:"Bungee",Impact,sans-serif;font-size:clamp(20px,5.4vw,30px);color:#fff;background:var(--ink);padding:5px 18px;border-radius:14px}
  @keyframes nudge{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
  @keyframes nudgeUp{from{transform:translateY(14px)}to{transform:translateY(-14px)}}

  .overlay{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .title{align-content:space-between;justify-items:center;text-align:center;gap:16px;
    background:linear-gradient(180deg,rgba(27,16,36,.25),rgba(27,16,36,0) 30%,rgba(27,16,36,0) 55%,rgba(27,16,36,.55));-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
  .logo{display:grid;justify-items:center;gap:6px;margin-top:3vh;transform:rotate(-4deg);animation:bob 2.4s ease-in-out infinite}
  .logo h1{margin:0;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:clamp(44px,min(14vw,12vh),108px);line-height:.84;color:var(--danfo);
    -webkit-text-stroke:3px var(--ink);text-shadow:0 8px 0 var(--ink),0 16px 26px rgba(0,0,0,.3)}
  .logo h1 span{display:block;color:#fff}
  .stripes{width:min(380px,74vw);height:22px;border:4px solid var(--ink);border-radius:8px;
    background:linear-gradient(var(--danfo) 0 20%,var(--ink) 20% 42%,var(--danfo) 42% 58%,var(--ink) 58% 80%,var(--danfo) 80%)}
  .tagline{font-family:"Bungee",Impact,sans-serif;font-size:clamp(14px,3.8vw,18px);color:#fff}
  @keyframes bob{50%{transform:rotate(-4deg) translateY(-10px)}}
  .bottom{display:grid;gap:10px;justify-items:center;margin-bottom:1vh;width:min(440px,100%);background:rgba(27,16,36,.88);
    border:3px solid rgba(255,255,255,.14);border-radius:24px;padding:12px 12px 12px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .play{border:4px solid var(--ink);border-radius:24px;padding:14px 46px;font-family:"Bungee",Impact,sans-serif;font-size:clamp(26px,7vw,36px);
    background:linear-gradient(#4ff0a0,var(--green));color:#fff;box-shadow:inset 0 6px 0 rgba(255,255,255,.35),0 8px 0 var(--ink);animation:pulse .8s ease-in-out infinite alternate}
  .play:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
  @keyframes pulse{to{transform:scale(1.06)}}
  .diffs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .dsel{pointer-events:auto;border:3px solid var(--ink);border-radius:16px;padding:6px 12px 5px;background:rgba(27,16,36,.72);color:#fff;
    box-shadow:0 4px 0 var(--ink);display:grid;justify-items:center;line-height:1.05;min-width:92px}
  .dsel b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:16px}
  .dsel small{font-weight:800;font-size:11px;opacity:.85;letter-spacing:.06em}
  .dsel[aria-checked="true"]{background:var(--danfo);color:var(--ink)}
  .dsel:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .chip.lvl{background:#fff}
  .meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-weight:800}
  .title .play{padding:10px 44px;font-size:clamp(24px,6.4vw,32px)}
  .sound{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;padding:4px 10px;font-size:13px}
  .pillm{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 12px;font-size:13px;font-variant-numeric:tabular-nums}
  .small{pointer-events:auto;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:5px 14px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
  .howto{font-weight:700;font-size:13px;line-height:1.35;color:#fff;opacity:.9;max-width:34ch}
  .coin-i.sm{display:inline-grid;width:18px;height:18px;font-size:10px;border-width:2px;vertical-align:-3px;margin-right:5px}
  .card{width:min(360px,100%);background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
    padding:18px 18px 20px;display:grid;gap:10px;justify-items:center;text-align:center}
  .card h2{margin:0;font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:clamp(38px,11vw,54px);color:var(--red);-webkit-text-stroke:2px var(--ink);line-height:1}
  .why{font-weight:700;font-size:16px;margin:0;line-height:1.3}
  .big{font-family:"Bungee",Impact,sans-serif;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
  .lbl{font-size:11px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;opacity:.6}
  .row{display:flex;gap:22px;justify-content:center;font-variant-numeric:tabular-nums}
  .row b{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:20px}
  .newbest{font-family:"Bungee",Impact,sans-serif;background:var(--danfo);border:3px solid var(--ink);border-radius:10px;padding:2px 14px;transform:rotate(-3deg)}
  .card .play{animation:none;padding:12px 30px}
  @media (prefers-reduced-motion:reduce){.logo,.play,.hint .arrows,.chip.cop{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Danfo Craze game"></canvas>

  <div class="hud" id="hud" hidden>
    <div>
      <div class="score ol" id="score">0</div>
      <div class="best ol" id="best">BEST 0</div>
      <div class="chips"><span class="chip lvl" id="dchip">AREA DRIVER</span><span class="chip" id="mult" hidden>x2</span><span class="chip cop" id="cop" hidden>POLICE!</span><span class="chip party" id="pwP" hidden>PARTY</span><span class="chip mag" id="pwM" hidden>MAGNET</span></div>
    </div>
    <div class="right"><div class="coins pax" aria-label="Passengers"><span class="pax-i"></span><span id="paxN">0</span></div><div class="coins"><span class="coin-i">₦</span><span id="coins">0</span></div><button class="pause" id="pauseBtn" type="button" aria-label="Pause">II</button></div>
  </div>
  <div class="hint" id="hint" hidden><div class="arrows ol" id="hintArrows">←&nbsp;→</div><div class="txt" id="hintTxt">SWIPE TO DODGE</div></div>
  <div id="toasts"></div>
  <div id="pops"></div>

  <div class="overlay title" id="title">
    <div class="logo"><h1>DANFO<span>CRAZE</span></h1><div class="stripes"></div><span class="tagline ol">Naija no dey carry last!</span></div>
    <div class="bottom">
      <div class="diffs" role="radiogroup" aria-label="Difficulty">
        <button class="dsel" type="button" role="radio" data-d="easy" aria-checked="false"><b>JJC</b><small>EASY</small></button>
        <button class="dsel" type="button" role="radio" data-d="normal" aria-checked="true"><b>AREA DRIVER</b><small>NORMAL</small></button>
        <button class="dsel" type="button" role="radio" data-d="hard" aria-checked="false"><b>AGBERO</b><small>HARD</small></button>
      </div>
      <button class="play" id="playBtn" type="button">PLAY</button>
      <span class="howto">Pick up passengers for points.<br>Swipe ← → to dodge · Swipe ↑ to hop potholes</span>
      <div class="meta"><span class="pillm" id="tBest">BEST 0</span><span class="pillm" id="tCoins">₦ 0 saved</span></div>
      </div>
    <button class="small sound" id="soundBtn" type="button">Sound: ON</button>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <h2 id="overT">CRASH!</h2>
      <p class="why" id="overWhy"></p>
      <span class="newbest" id="newBest" hidden>NEW BEST!</span>
      <div><div class="lbl">Score</div><div class="big" id="oScore">0</div></div>
      <div class="row"><div><div class="lbl">Passengers</div><b id="oPax">0</b></div><div><div class="lbl">Coins</div><b id="oCoins">0</b></div><div><div class="lbl">Best</div><b id="oBest">0</b></div></div>
      <button class="play" id="againBtn" type="button">PLAY AGAIN</button>
      <button class="small" id="homeBtn" type="button">Home</button>
    </div>
  </div>
  <div class="overlay" id="paused" hidden>
    <div class="card"><h2 style="color:var(--danfo)">PAUSED</h2><button class="play" id="resumeBtn" type="button">RESUME</button><button class="small" id="pHomeBtn" type="button">Home</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ri = n => Math.floor(Math.random() * n);
const pick = a => a[ri(a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem('danfocraze.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('danfocraze.' + k, JSON.stringify(v)); } catch (e) {} },
};
const OUT = '#1b1024';

// ---------------------------------------------------------------- world
const LANES = [-0.62, 0, 0.62];
const D = 6, FAR = 90, ZP = 2, JT = .55, JH = .26;
const DIFFS = { easy: { name: 'JJC', start: 16, max: 36, acc: .14, gap: 1.25, two: .08 }, normal: { name: 'AREA DRIVER', start: 20, max: 46, acc: .2, gap: 1, two: .2 }, hard: { name: 'AGBERO', start: 25, max: 56, acc: .28, gap: .85, two: .32 } };
let diff = 'normal';
const START = 20;
const ZONE_LEN = 650;
const ZONES = [{ k: 'lagos', name: 'LAGOS · OSHODI' }, { k: 'bridge', name: 'THIRD MAINLAND BRIDGE' }, { k: 'village', name: 'VILLAGE ROAD' },
  { k: 'abuja', name: 'ABUJA' }, { k: 'ph', name: 'PORT HARCOURT' }, { k: 'kano', name: 'KANO' }];
const ZSHOPS = {
  lagos: ['SUYA SPOT', 'MAMA PUT', "GOD'S GRACE PHONES", 'AMALA JOINT', 'POS · CASH OUT', 'VULCANIZER', 'BLESSED HANDS SALON', 'IYA BASIRAT BUKKA'],
  abuja: ['WUSE MARKET', 'ASO VILLA ROAD', 'JABI LAKE MALL', 'CAPITAL HOTEL', 'NATIONAL STADIUM', 'GARKI PLAZA', 'CBD TOWERS'],
  ph: ['MILE ONE MARKET', 'GARDEN CITY SUYA', 'RUMUOKORO MOTORS', 'BOLI & FISH', 'OIL CITY PHONES', 'PH PEPPER SOUP', 'WATERSIDE POS'],
  kano: ['KURMI MARKET', 'KILISHI & SUYA', 'ALHAJI TEXTILES', 'SABON GARI STORES', 'DALA HILL SHOP', 'KANO PILLARS FANS'],
  village: ['MAMA NKECHI PROVISIONS', 'CHURCH OF GOD MISSION', 'PALM WINE JOINT', 'BARBING SALON', 'VILLAGE SQUARE'] };
const ZSTOPS = { lagos: ['OSHODI', 'OJUELEGBA', 'YABA', 'CMS'], abuja: ['WUSE', 'GARKI', 'MAITAMA', 'KUBWA'], ph: ['MILE ONE', 'RUMUOKORO', 'GARRISON', 'CHOBA'], kano: ['KURMI', 'SABON GARI', 'KOFAR MATA'] };
const ZCALLS = { lagos: ['Oshodi! Oshodi! Enter!', 'CMS straight!', 'Yaba! Obalende!'], abuja: ['Wuse! Wuse! Enter!', 'Garki! Area One!', 'Kubwa, Kubwa!'],
  ph: ['Mile One! Mile One!', 'Rumuokoro, Choba!', 'Garrison! Enter quick!'], kano: ['Kurmi! Kurmi market!', 'Sabon Gari! Enter!'], village: ['Village square! Who dey drop?', 'Oya, hold your goat well!'], bridge: ['Third Mainland! No stopping!'] };
const SLOGANS = ['NO FOOD FOR LAZY MAN', "GOD'S TIME IS THE BEST", 'MONEY MISS ROAD', 'EYES DEY SEE', 'NO KING AS GOD', 'SHINE YOUR EYE'];
const SHOPS = ['SUYA SPOT', 'MAMA PUT', "GOD'S GRACE PHONES", 'AMALA JOINT', 'POS · CASH OUT', 'VULCANIZER', 'BLESSED HANDS SALON', 'ALHAJI & SONS', 'IYA BASIRAT BUKKA', 'CHOP & CLEAN'];
const TOWERS = ['EKO TOWER', 'LEKKI MALL', 'TECH HUB', 'ISLAND BANK', 'OCEAN VIEW'];
const BOARDS = ['BUY LAND FOR EPE', 'JOLLOF WARS · SAT', 'LAGOS · CENTRE OF EXCELLENCE', 'WAKE UP NAIJA · 99.1FM'];
const STOPNAMES = ZSTOPS.lagos;
const CALLS = ['Enter with your change!', 'Shift for back abeg!', 'One chance remain!', 'Who never pay?', 'Owa! Owa!', 'Driver, go jeje!', 'Oya enter, we dey go!', 'No story, pay your money!'];

let W, H, DPR, U, cx, hy, gy, skyline = [];
const clouds = Array.from({ length: 6 }, () => ({ x: rand(), y: rand(.05, .24), s: rand(.7, 1.3), v: rand(.004, .012) }));
function resize() {
  DPR = Math.min(1.75, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W * .66, H * .6); cx = W / 2; hy = H * .36; gy = H * 1.02;
  skyline = []; let x = -20;
  while (x < W + 20) { const w = rand(22, 70); skyline.push({ x, w, h: rand(.03, .15) * H, c: pick(['#a9b8ec', '#b9c4f2', '#9cadea']) }); x += w + rand(2, 10); }
}
function P3(x, y, z) { const p = D / (D + z); return { x: cx + x * U * p, y: hy + (gy - hy) * p - y * U * p, s: U * p, p }; }

// ---------------------------------------------------------------- drawing helpers (cartoon: bold fill + thick ink outline)
const shadeCache = new Map();
function shade(hex, f) {
  const k = hex + f; let v = shadeCache.get(k); if (v) return v;
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const t = f < 0 ? 0 : 255, a = Math.abs(f);
  v = `rgb(${Math.round(r + (t - r) * a)},${Math.round(g + (t - g) * a)},${Math.round(b + (t - b) * a)})`; shadeCache.set(k, v); return v;
}
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const lwOf = (w, h) => clamp(Math.min(w, h) * .07, 1, 3.4);
function blob(x, y, w, h, r, col, hl = true) {
  if (w < .5 || h < .5) return;
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, shade(col, .25)); g.addColorStop(.55, col); g.addColorStop(1, shade(col, -.2));
  rr(x, y, w, h, r); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = lwOf(w, h); ctx.strokeStyle = OUT; ctx.stroke();
  if (hl && w > 10 && h > 8) { ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(x + w * .28, y + h * .22, w * .16, Math.max(1, h * .07), -.2, 0, 7); ctx.fill(); }
}
function flat(x, y, w, h, r, col, lw = 1.5) { if (w < .5 || h < .5) return; rr(x, y, w, h, r); ctx.fillStyle = col; ctx.fill(); if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke(); } }
function ball(x, y, r, col) {
  if (r < .4) return;
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, shade(col, .4)); g.addColorStop(.65, col); g.addColorStop(1, shade(col, -.25));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.lineWidth = clamp(r * .14, 1, 3); ctx.strokeStyle = OUT; ctx.stroke();
}
function poly(pts, col, lw = 0) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath();

const SIDE = { lagos: ['#f6e0bd', '#ead2aa'], abuja: ['#8fd46a', '#84ca5f'], ph: ['#e6dcc6', '#d9ceb6'], kano: ['#efd49d', '#e3c68b'], village: ['#d9844c', '#cc7843'] };
function drawGround() {

function fade(z) { return clamp((FAR - z) / 14, 0, 1); }

const NOTE_COLS = ['#FFC91A', '#18b86b', '#ff4fa3'];
